name: Web build (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build
        run: |
          emcmake cmake -S port -B port/build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build port/build-web -j --target blockout
      - name: Assemble site
        run: |
          mkdir -p site
          cp port/build-web/blockout.html site/index.html
          cp port/build-web/blockout.js port/build-web/blockout.wasm site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
