name: Binaries

# Every push to master produces downloadable builds (Actions -> run -> Artifacts).
# Pushing a tag like v1.0 also publishes them as a GitHub Release.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04   # older glibc, so the binary runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libdecor-0-dev
      - name: Build
        run: |
          cmake -S . -B build -DBO_VENDOR_SDL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --target blockout
      - name: Package
        run: |
          mkdir -p dist/blockout && cp build/blockout README.md dist/blockout/
          tar -C dist -czf blockout-linux-x64.tar.gz blockout
      - uses: actions/upload-artifact@v4
        with:
          name: blockout-linux-x64
          path: blockout-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja zip
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DBO_VENDOR_SDL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target blockout
      - name: Package
        run: |
          mkdir -p dist/blockout && cp build/blockout.exe README.md dist/blockout/
          (cd dist && zip -r ../blockout-windows-x64.zip blockout)
      - uses: actions/upload-artifact@v4
        with:
          name: blockout-windows-x64
          path: blockout-windows-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal arm64 + x86_64)
        run: |
          cmake -S . -B build -DBO_VENDOR_SDL=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j --target blockout
      - name: Package
        run: |
          codesign --force --deep --sign - build/blockout.app
          ditto -c -k --keepParent build/blockout.app blockout-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blockout-macos-universal
          path: blockout-macos-universal.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j --target blockout
      - name: Package
        run: |
          mkdir -p blockout-web
          cp build-web/blockout.html blockout-web/index.html
          cp build-web/blockout.js build-web/blockout.wasm blockout-web/
          zip -r blockout-web.zip blockout-web
      - uses: actions/upload-artifact@v4
        with:
          name: blockout-web
          path: blockout-web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
