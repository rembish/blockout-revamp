<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BlockOut</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #7f9cd9; font: 16px system-ui, sans-serif; letter-spacing: .1em; pointer-events: none; }
  #corner { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
            display: flex; gap: 6px; }
  #corner a, #corner button { display: flex; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px;
            align-items: center; justify-content: center; background: rgba(12, 20, 48, .55); color: #7f9cd9;
            opacity: .55; cursor: pointer; transition: opacity .2s; }
  #corner a:hover, #corner button:hover { opacity: 1; }
  #corner svg { width: 18px; height: 18px; fill: currentColor; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">LOADING…</div>
<div id="corner">
  <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
  </button>
  <a href="https://github.com/rembish/blockout-revamp" target="_blank" rel="noopener" title="Source code on GitHub" aria-label="Source code on GitHub">

  </a>
</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (t) { document.getElementById('status').textContent = t ? t.toUpperCase() : ''; },
    onRuntimeInitialized: function () { document.getElementById('status').textContent = ''; },
  };
  window.addEventListener('keydown', function (e) {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'].indexOf(e.key) >= 0)
      e.preventDefault();
  }, { passive: false });
  // no pinch-zoom, double-tap zoom or pull-to-refresh on phones
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  window.addEventListener('load', function () { Module.canvas.focus(); });
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('#corner')) Module.canvas.focus();
  });
  var fs = document.getElementById('fullscreen');
  if (document.fullscreenEnabled) {
    fs.hidden = false;
    fs.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
      Module.canvas.focus();
    });
  }
</script>

</html>
